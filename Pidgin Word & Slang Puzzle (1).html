function genCW(){
 for(var at=0;at<400;at++){
  var ws=shuf(CWW).slice(0,10).sort(function(a,b){return b[0].length-a[0].length});
  var L={},D={},pl=[];
  function key(r,c){return r+','+c}
  function can(w,r,c,d){var dr=d?1:0,dc=d?0:1,ov=0;

    else{if(L[key(rr+dc,cc+dr)]||L[key(rr-dc,cc-dr)])return false}}
   return ov>0}

   for(var d=0;d<2;d++)for(var q in L){var p=q.split(',');var r0=+p[0],c0=+p[1];
